name: README build

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update profile assets
        env:
          USER_NAME: senior-13j
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || github.token }}
        run: python today.py

      - name: Commit changes
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add README.md dark_mode.svg light_mode.svg
          git diff --cached --quiet || git commit -m "Update profile README"
          git push
